<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splunk // Training Terminal</title>
  <meta name="description" content="Entraînement QCM pour la certification Splunk Core Certified User (SPLK-1001).">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applique le thème avant l'affichage (évite un flash).
    (function () {
      var th = null;
      try { th = localStorage.getItem("splunk-theme"); } catch (e) {}
      if (th !== "light" && th !== "dark") th = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = th;
    })();
  </script>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#/" class="brand" data-nav="home">
      <span class="brand-lock">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M8 6l8 6-8 6"/></svg>
      </span>
      <span class="brand-text">SPLUNK<span class="accent">://</span>training</span>
    </a>
    <div class="topbar-right">
      <span id="mode-badge" class="badge"></span>
      <div class="seg" role="group" aria-label="Langue / Language">
        <button class="seg-btn mono" data-lang="fr" aria-pressed="false">FR</button>
        <button class="seg-btn mono" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button id="btn-theme" class="icon-btn" aria-pressed="false">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <span id="user-label" class="user-label"></span>
      <button id="btn-logout" class="btn btn-ghost btn-sm" hidden>Déconnexion</button>
    </div>
  </header>

  <nav id="main-nav" class="main-nav" hidden aria-label="Navigation">
    <a href="#/" data-main="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Entraînement</span></a>
    <a href="#/suivi" data-main="suivi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v16H3zM3 9h18M8 3v4M16 3v4M8 14l2.5 2.5L16 12"/></svg><span>Suivi</span></a>
    <a href="#/history" data-main="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2"/></svg><span>Historique</span></a>
  </nav>

  <main id="app" class="container">
    <div class="boot">
      <p class="mono">&gt; boot<span class="cursor">_</span></p>
    </div>
  </main>

  <footer class="footer mono">
    <span id="footer-src"></span>
    <span id="footer-keys"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/matrix.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
